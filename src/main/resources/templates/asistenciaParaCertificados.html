<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia para certificado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/styleAsistencia.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/styleCustom.css}" />
    <link rel="icon" th:href="@{/images/Logobgremove.png}" type="image/x-icon" />
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="contenedor">
        <main>
            <div id="carta" class="card">
                <div id="logo"><img th:src="@{/images/Logobgremove.png}" alt="Logo E-volution"></div>
                <div class="card-body">
                    <form id="formAsistencia">
                        <label for="nombre">Nombre completo</label>
                        <input id="NombreTemp" name="nombre" required class="form-control" type="text" placeholder="Nombre Apellidos">
                        <br>
                        <label for="correo">Correo</label>
                        <input type="email" class="form-control" name="correo" required placeholder="correo@dominio.com" >
                        <br>
                        <label for="rut">RUT</label>
                        <input id="rutTemp" type="text" class="form-control" placeholder="11111111-1" name="rut">
                        <br>
                        <input type="hidden" name="id" th:value="${id}">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="checkboxConfirmacion" id="checkboxConfirmacion">
                            <label id="textoConfirmacion" style="font-style: italic;" class="form-check-label" for="checkboxConfirmacion">
                                Declaro que los datos proporcionados serán utilizados exclusivamente para la generación del certificado correspondiente, sin ningún otro propósito adicional. Asimismo, confirmo que la información enviada es veraz, correcta y actualizada.
                            </label>
                        </div>
                        <br>
                        <div style="display: flex;justify-content: center;align-items: center;"><button id="botonEnviar" type="submit" class="btn btn-success">Enviar datos</button></div>
                    </form>
                </div>
            </div>
        </main>
        <footer>
            <a href="https://e-volution.cl/"><i class="bi bi-house-door-fill"></i></a>
            <a href="https://www.facebook.com/p/E-volution-Capacitaci%C3%B3n-100071181459358/"><i class="bi bi-facebook"></i></a>
            <a href="mailto:contacto@e-volution.cl"><i class="bi bi-envelope-at-fill"></i></a>
            <a href="tel:+56412223639"><i class="bi bi-telephone-fill"></i></a>
            <a href="https://maps.app.goo.gl/Cpq3uNEGjyKTWv5x9"><i class="bi bi-geo-alt-fill"></i></a>
        </footer>
    </div>
    <script th:src="@{/js/scriptAsistencia.js}"></script>
</body>
</html>
