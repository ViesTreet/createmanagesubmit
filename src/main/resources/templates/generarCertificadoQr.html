<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia para certificado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styleValidacion.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/styleCustom.css}" />
    <link rel="icon" th:href="@{/images/Logobgremove.png}" type="image/x-icon" />
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body th:data-id-enc="${idEnc}"
  th:data-validez="${val}">
    <div class="contenedor">
        <main>
            <div id="carta" class="card">
                <div id="logo"><img th:src="@{/images/Logobgremove.png}" alt="Logo E-volution"></div>
                <div class="card-body">
                    <div class="datos">
                        <h3>Datos Certificado</h3>
                        <div><p><b>V</b>alidez:<span th:text="${val}"></span></p></div>
                        <div><p><b>N</b>ombre:<span th:text="${alumno.nombreAsistente}"></span></p></div>
                        <div><p><b>C</b>urso:<span th:text="${alumno.nombreCurso}"></span></p></div>
                        <div><p><b>C</b>orrelativo:<span th:text="${alumno.numeroCorrelativoInterno}"></span></p></div>
                    </div>
                    <div id="divDescargar"><button id="botonDescargar" class="btn-lg btn btn-success">Descargar certificado</button></div>
                </div>
            </div>
        </main>
        <footer>
            <a href="https://e-volution.cl/"><i class="bi bi-house-door-fill"></i></a>
            <a href="https://www.facebook.com/p/E-volution-Capacitaci%C3%B3n-100071181459358/"><i class="bi bi-facebook"></i></a>
            <a href="mailto:contacto@e-volution.cl"><i class="bi bi-envelope-at-fill"></i></a>
            <a href="tel:+56412223639"><i class="bi bi-telephone-fill"></i></a>
            <a href="https://maps.app.goo.gl/Cpq3uNEGjyKTWv5x9"><i class="bi bi-geo-alt-fill"></i></a>
        </footer>
    </div>
    <script th:src="@{/js/scriptValidacion.js}"></script>
</body>
</html>
