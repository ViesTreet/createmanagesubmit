  <style>
    .celda-scroll {
      height: 60px;
      overflow-y: auto;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      word-break: break-word;
      padding: 4px;
    }

    th {
      font-size: 13px;
    }

    td {
      overflow-x: auto;
      font-size: 11px;
      word-break: break-word;
      white-space: normal;
      vertical-align: top;
    }

    #alumnoBuscador {
      padding-right: 0px;
      padding-left: 0px;
    }

    .overlay {
      display: none;
      /* Oculto por defecto */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      /* Fondo oscuro */
      z-index: 999;
      /* Por encima de otros elementos */
    }

    /* Contenedor del formulario emergente */
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      /* Por encima del overlay */
    }

    /* Botón cerrar */
    .close-btn {
      background-color: red;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .close-btn:hover {
      background-color: darkred;
    }

    /* Botón principal */
    .open-btn {
      margin: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #alumnosNoEnviados {
      height: 50vh;
      /* Define una altura fija */
      overflow-y: auto;
      /* Permite el desplazamiento vertical cuando el contenido es grande */
    }

    @media (min-width: 1024px) {
      #contenderBase {
        max-width: 95vw;
      }
    }

    @media (max-width: 768px) {
      #contenderBase {
        max-width: 100vw !important;
        padding-left: 0px !important;
        padding-right: 0px !important;
      }

      #contenedorTabla {
        max-width: 100vw !important;
        overflow-y: auto;
        overflow-x: auto;
      }

      #alumnoBuscador {

      }

      th {
        font-size: 15px;
      }

      td {
        overflow-x: auto;
        font-size: 12px;
      }

      #tablaPlantilla {
        width: 250vw;
      }
    }
  </style>

  <script th:inline="javascript">
    function cargarDatos() {
      $.ajax({
        url: "/api/datosCurso",
        method: "GET",
        success: function (data) {
          var tbody = $("#tablaCurso tbody");
          tbody.empty(); // Limpiar la tabla antes de agregar nuevos datos
          var adminCorreo = /*[[${admin.correo}]]*/ "default";
          $.each(data, function (i, curso) {
            // Construir la fila
            let estiloFila = "";
            let aviso = "";

            let fechaEvaluar = null;

            if (curso.jornadas && curso.jornadas.length > 0) {

              const ahora = new Date();

              // ordenar por fecha
              const jornadasOrdenadas = curso.jornadas
                .map(j => new Date(j.fechaInicio))
                .sort((a, b) => a - b);

              // buscar la próxima jornada
              fechaEvaluar = jornadasOrdenadas.find(f => f >= ahora);

              // si no hay futura → usar la última
              if (!fechaEvaluar) {
                fechaEvaluar = jornadasOrdenadas[jornadasOrdenadas.length - 1];
              }
              if (fechaEvaluar) {

                const ahora = new Date();
                const diffMs = fechaEvaluar - ahora;
                const diffDias = diffMs / (1000 * 60 * 60 * 24);

                if (diffDias <= 1 && diffDias >= 0) {
                  estiloFila = " style='background-color: #fff3cd;'";
                  aviso = " (Próximo)";
                } else if (diffDias > 1) {
                  estiloFila = " style='background-color: #e7f5ff;'";
                } else {
                  estiloFila = " style='background-color: #f8d7da;'";
                  aviso = " (Finalizado)";
                }
              }
            }

            var fila =
              "<tr>" +
              "<td><div class='celda-scroll'>" +
              (curso.nombreCurso ?? "") +
              "</div></td>" +
              "<td " +
              estiloFila +
              "><div class='celda-scroll'>" +
              (fechaEvaluar ? formatearFecha(fechaEvaluar.toISOString()) + aviso : "") +
              "</div></td>" +
              "<td><div class='celda-scroll'>" +
              (curso.ciudad && curso.ubicacionSubida
                ? curso.ciudad + ", " + curso.ubicacionSubida
                : "") +
              "</div></td>" +
              "<td><div class='celda-scroll'>" +
              (curso.cliente ?? "") +
              "</div></td>" +
              "<td><div class='celda-scroll'>" +
              (curso.relator ?? "") +
              "</div></td>" +
              "<td><div class='celda-scroll'>" +
              (curso.alumnos ?? 0) +
              "</div></td>" +
              "<td style='width: 25vw;display: flex; justify-content: space-around;'><div class='celda-scroll'>" +
              "<a class='btn btn-sm btn-primary' href='/dataBaseCurso/Curso/" +
              curso.id +
              "/editar'>Editar</a>" +
              "<a class='btn btn-sm btn-secondary' href='/dataBaseCurso/Curso/" +
              curso.id +
              "/alumnos'>Alumnos</a>" +
              "<button class='btn btn-sm btn-success' onclick='descargarFlyer(" + curso.id + ")'>Flyer</button>";

            if (adminCorreo === "admin@admin.com") {
              fila +=
                "<button class='btn btn-danger btn-sm' onclick='eliminarCurso(" +
                curso.id +
                ")'>Borrar</button>";
            }

            fila += "</div></td></tr>";


            tbody.append(fila);
          });
        },
        error: function (error) {
          console.log("Error al obtener los datos", error);
        },
      });
    }
    $(document).ready(function () {
      // Cargar datos inicialmente
      cargarDatos();

      // Actualizar la tabla cada 30 segundos
      setInterval(function () {
        if (filtrosActivos.length > 0) {
          cargarDatosConFiltros();
        } else {
          cargarDatos();
        }
      }, 30000);
    });
  </script>

  <script th:inline="javascript">
    var adminCorreo = /*[[${admin.correo}]]*/ "default";
    const checkboxKey = "checkboxStates";
    let filtrosActivos = [];

    function crearCardFiltro(filtro, valor) {
      return `<div class="card filtro-card" style="max-width: 300px;">
                    <div class="card-body p-2 d-flex justify-content-between align-items-center">
                        <span>${filtro}: ${valor}</span>
                        <button type="button" class="btn-close" data-filtro="${filtro}" data-valor="${valor.replace(
        /"/g,
        "&quot;",
      )}"></button>
                    </div>
                </div>`;
    }

    // Agregar este evento delegado para los botones de cerrar
    $(document).on("click", ".btn-close", function () {
      const filtro = $(this).data("filtro");
      const valor = $(this).data("valor");
      removerFiltro(filtro, valor);
    });

    function actualizarFiltrosVisibles() {
      const contenedor = $("#filtros-activos");
      contenedor.empty();
      filtrosActivos.forEach((filtro) => {
        contenedor.append(crearCardFiltro(filtro.campo, filtro.valor));
      });
    }

    function agregarFiltro() {
      const filtro = $("#filtroBusquedaAlumno").val();
      const valor = $("#busquedaAlumno").val().trim();

      if (valor) {
        // Evitar duplicados
        if (
          !filtrosActivos.some((f) => f.campo === filtro && f.valor === valor)
        ) {
          filtrosActivos.push({ campo: filtro, valor: valor });
          actualizarFiltrosVisibles();
          cargarDatosConFiltros();
        }
        $("#busquedaAlumno").val("");
      }
    }

    function removerFiltro(filtro, valor) {
      filtrosActivos = filtrosActivos.filter(
        (f) => !(f.campo === filtro && String(f.valor) === String(valor)),
      );

      actualizarFiltrosVisibles();

      if (filtrosActivos.length > 0) {
        cargarDatosConFiltros();
      } else {
        cargarDatos();
      }
    }

    function cargarDatosConFiltros() {
      $.ajax({
        url: "/api/datosCurso/busquedaMultiFiltro",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify(filtrosActivos),
        success: function (data) {
          // Actualizar tabla con los datos recibidos
          actualizarTabla(data);
        },
      });
    }

    function actualizarTabla(data) {
      var tbody = $("#tablaCurso tbody");
      tbody.empty();

      $.each(data, function (i, curso) {
        // Construir la fila
        let estiloFila = "";
        let aviso = "";

        let fechaEvaluar = null;

        if (curso.jornadas && curso.jornadas.length > 0) {

          const ahora = new Date();

          // ordenar por fecha
          const jornadasOrdenadas = curso.jornadas
            .map(j => new Date(j.fechaInicio))
            .sort((a, b) => a - b);

          // buscar la próxima jornada
          fechaEvaluar = jornadasOrdenadas.find(f => f >= ahora);

          // si no hay futura → usar la última
          if (!fechaEvaluar) {
            fechaEvaluar = jornadasOrdenadas[jornadasOrdenadas.length - 1];
          }
          if (fechaEvaluar) {

            const ahora = new Date();
            const diffMs = fechaEvaluar - ahora;
            const diffDias = diffMs / (1000 * 60 * 60 * 24);

            if (diffDias <= 1 && diffDias >= 0) {
              estiloFila = " style='background-color: #fff3cd;'";
              aviso = " (Próximo)";
            } else if (diffDias > 1) {
              estiloFila = " style='background-color: #e7f5ff;'";
            } else {
              estiloFila = " style='background-color: #f8d7da;'";
              aviso = " (Finalizado)";
            }
          }
        }

        var fila =
          "<tr>" +
          "<td><div class='celda-scroll'>" +
          (curso.nombreCurso ?? "") +
          "</div></td>" +
          "<td " +
          estiloFila +
          "><div class='celda-scroll'>" +
          (fechaEvaluar ? formatearFecha(fechaEvaluar.toISOString()) + aviso : "") +
          "</div></td>" +
          "<td><div class='celda-scroll'>" +
          (curso.ciudad && curso.ubicacionSubida
            ? curso.ciudad + ", " + curso.ubicacionSubida
            : "") +
          "</div></td>" +
          "<td><div class='celda-scroll'>" +
          (curso.cliente ?? "") +
          "</div></td>" +
          "<td><div class='celda-scroll'>" +
          (curso.relator ?? "") +
          "</div></td>" +
          "<td><div class='celda-scroll'>" +
          (curso.alumnos ?? 0) +

  <script th:inline="javascript">
    $(document).ready(function () {
      let clienteSeleccionado = false;

      $("#clienteInput").on("input", function () {
        const texto = $(this).val();
        clienteSeleccionado = false;
        $("#clienteId").val("");

        if (texto.length < 2) {
          $("#clienteResultados").hide();
          return;
        }

        $.get("/api/clientes/buscar", { q: texto }, function (data) {
          const contenedor = $("#clienteResultados");
          contenedor.empty();

          if (data.length === 0) {
            contenedor.hide();
            return;
          }

          data.forEach((cliente) => {
            contenedor.append(`
                            <button 
                                type="button"
                                class="list-group-item list-group-item-action"
                                data-id="${cliente.id}"
                                data-nombre="${cliente.nombreCliente}">
                                ${cliente.nombreCliente}
                            </button>
                        `);
          });

          contenedor.show();
        });
      });

      // CLICK EN OPCIÓN
      $(document).on("click", "#clienteResultados button", function () {
        $("#clienteInput").val($(this).data("nombre"));
        $("#clienteId").val($(this).data("id"));
        clienteSeleccionado = true;
        $("#clienteResultados").hide();
      });

      // BLOQUEO SI NO SE SELECCIONÓ
      $("form").on("submit", function (e) {
        if (!clienteSeleccionado) {
          e.preventDefault();
          alert("Debes seleccionar un cliente válido de la lista");
          $("#clienteInput").focus();
        }
      });
    });
  </script>

  <script>
    function formatearFecha(fechaISO) {
      if (!fechaISO) return "";

      const fecha = new Date(fechaISO);

      const dd = String(fecha.getDate()).padStart(2, "0");
      const mm = String(fecha.getMonth() + 1).padStart(2, "0");
      const aa = String(fecha.getFullYear());
      const hh = String(fecha.getHours()).padStart(2, "0");
      const min = String(fecha.getMinutes()).padStart(2, "0");

      return `${dd}-${mm}-${aa} ${hh}:${min}`;
    }
  </script>
  <script th:inline="javascript">
    document
      .getElementById("enviarCurso")
      .addEventListener("click", function (e) {
        e.preventDefault(); // evita submit normal

        const nombreCurso = document.getElementById("nombreCurso").value;

        const form = e.target.closest("form");
        const formData = new FormData(form);

        fetch(form.action, {
          method: "POST",
          body: formData,
        })
          .then((response) => response.blob()) // espera archivo (flyer)
          .then((blob) => {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "flyer-" + nombreCurso + ".pptx"; // nombre de descarga
            document.body.appendChild(a);
            a.click();
            a.remove();

            closeForm(); // cerramos el overlay
            location.href = "/dataBaseCurso"; // redirige después
          })
          .catch((err) => alert("Error al generar el flyer: " + err));
      });
  </script>
  <script th:inline="javascript">
    async function descargarFlyer(id) {
      try {
        const response = await fetch("/api/dataBaseCurso/descargarFlyer", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ id: id }),
        });

        if (!response.ok) {
          throw new Error("Error al descargar el flyer");
        }

        const blob = await response.blob();

        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "Flyer.pptx";
        document.body.appendChild(a);
        a.click();

        a.remove();
        window.URL.revokeObjectURL(url);
      } catch (error) {
        console.error("Error:", error);
        alert("Error al generar el flyer");
      }
    }
  </script>
  <script th:inline="javascript">
    function eliminarCurso(id) {
      if (!confirm("¿Seguro que quieres eliminar este curso?")) {
        return;
      }

      fetch("/api/dataBaseCurso/borrarCurso/" + id, {
        method: "DELETE",
      })
        .then((response) => {
          if (response.ok) {
            location.reload();
          } else {
            alert("Error al eliminar curso");
          }
        })
        .catch((error) => {
          console.error(error);
          alert("Error de conexión");
        });
    }
  </script>
