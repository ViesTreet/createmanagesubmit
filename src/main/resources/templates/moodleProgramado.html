<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programación de Certificados</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styleCustom.css">
    <link rel="icon" href="/images/Logobgremove.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        .scrollable-table {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .form-card {
            max-width: 800px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <header class="d-flex align-items-center justify-content-between p-3 bg-light" style="height: 10vh;">
        <a href="/home" class="logo"><img src="/images/Logobgremove.png" alt="[LOGO]"></a>
        <nav class="d-flex justify-content-center align-items-center flex-nowrap">
            <a href="/home" class="btn btn-primary mx-2">Inicio</a>
            <a href="/documentacion" target="_blank" class="btn btn-primary mx-2">Documentación</a>
            <div class="d-flex flex-column justify-content-center align-items-center">
                <i class="fa-solid fa-user"></i>
                <p class="p-0 m-0" style="font-size: normal;" th:text="${admin.nombre}"></p>
            </div>
        </nav>
    </header>

    <main class="container">
        <!-- Formulario en Card -->
        <div class="card form-card shadow">
            <div class="card-body">
                <h4 class="text-center mb-4">Programar Certificados para Moodle</h4>
                <form th:action="@{/programarCertificadoMoodle/crear}" method="post">
                    <div class="row g-3 mb-4">
                        <!-- Selector de Curso -->
                        <div class="col-md-6">
                            <label for="cursoMoodle" class="form-label">Curso de Moodle</label>
                            <select class="form-select" id="cursoMoodle">
                                <option value="">Seleccionar Curso</option>
                                <option th:each="curso : ${cursosMoodle}" 
                                        th:value="${curso.id}" 
                                        th:text="${curso.nombre}"></option>
                            </select>
                        </div>

                        <!-- Selector de Plantilla -->
                        <div class="col-md-6">
                            <label for="plantilla" class="form-label">Plantilla</label>
                            <select class="form-select" id="plantilla">
                                <option th:each="plantilla : ${plantillas}" 
                                        th:value="${plantilla.id}" 
                                        th:text="${plantilla.nombreCertificado}"></option>
                            </select>
                        </div>
                    </div>
                    <div><p><i>*Datos que se usarán en el certificado(No es obligatorio rellenar todos los datos).</i></p></div>
                    <!-- Campos del Formulario -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label for="curso" class="form-label">Nombre del Curso</label>
                            <input type="text" class="form-control" id="curso"  placeholder="Capacitancion en ...">
                        </div>
                        
                        <div class="col-md-4">
                            <label for="diasCursos" class="form-label">Días del Curso</label>
                            <input type="text" class="form-control" id="diasCursos" placeholder="Del 7 de enero al ...">
                        </div>
                        
                        <div class="col-md-4">
                            <label for="numeroHoras" class="form-label">Duración</label>
                            <input type="text" class="form-control" id="numeroHoras" placeholder="3 horas">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label for="modalidad" class="form-label">Modalidad</label>
                            <input type="text" class="form-control" id="modalidad" placeholder="Online">
                        </div>
                        
                        <div class="col-md-4">
                            <label for="cliente" class="form-label">Cliente</label>
                            <input type="text" class="form-control" id="cliente" placeholder="Municipalidad de ...">
                        </div>
                        
                        <div class="col-md-4">
                            <label for="relator" class="form-label">Relator</label>
                            <input type="text" class="form-control" id="relator" placeholder="Juan ...">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="lugarYfechaEmision" class="form-label">Lugar y Fecha de Emisión</label>
                            <input type="text" class="form-control" id="lugarYfechaEmision" placeholder="Concepcion, 3 de ...">
                        </div>
                        
                        <div class="col-md-6">
                            <label for="fechaDeEjecucion" class="form-label">Fecha de Ejecución</label>
                            <input type="date" class="form-control" id="fechaDeEjecucion">
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">Programar Certificado</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de Tareas Programadas -->

                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer class="text-center p-3 bg-light d-flex justify-content-center align-items-center" style="height: 15vh;">
        <div>
            <div><i class="fa-solid fa-phone"></i><a href="tel:+56 41 3830944">+56 41 3830944</a></div>
