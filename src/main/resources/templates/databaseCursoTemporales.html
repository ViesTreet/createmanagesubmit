<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Base de datos cursos</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Importar CSS de Bootstrap -->
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
  <link rel="stylesheet" th:href="@{/css/styleCustom.css}" />
  <link rel="icon" th:href="@{/images/Logobgremove.png}" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <!-- Importar jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <!-- Importar JS de Bootstrap -->

  <style>
    th {
      font-size: 13px;
    }

    td {
      overflow-x: auto;
      font-size: 11px;
    }

    #alumnoBuscador {
      padding-right: 0px;
      padding-left: 0px;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1050;
    }

    .modal-qr-img {
      display: block;
      margin: 0 auto 12px;
      max-width: 100%;
      height: auto;
    }
    /* Contenedor del formulario emergente */
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      /* Por encima del overlay */
    }

    /* Botón cerrar */
    .close-btn {
      background-color: red;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .close-btn:hover {
      background-color: darkred;
    }

    /* Botón principal */
    .open-btn {
      margin: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #alumnosNoEnviados {
      height: 50vh;
      /* Define una altura fija */
      overflow-y: auto;
      /* Permite el desplazamiento vertical cuando el contenido es grande */
    }

    @media (min-width: 1024px) {
      #contenderBase {
        max-width: 95vw;
      }
    }

    @media (max-width: 768px) {
      #contenderBase {
        max-width: 100vw !important;
        padding-left: 0px !important;
        padding-right: 0px !important;
      }

      #contenedorTabla {
        max-width: 100vw !important;
        overflow-y: auto;
        overflow-x: auto;
      }

      #alumnoBuscador {
        max-width: 100vw !important;
      }

      th {
        font-size: 15px;
      }

      td {
        overflow-x: auto;
        font-size: 12px;
      }

      #tablaPlantilla {
        width: 250vw;
      }
    }
  </style>
</head>

<body>
  <header class="d-flex align-items-center justify-content-between p-3 bg-light" style="height: 10vh; z-index: 1">
    <a th:href="@{/home}" class="logo">
      <img th:src="@{/images/Logobgremove.png}" alt="[LOGO]" />
    </a>
    <nav class="d-flex justify-content-center align-items-center flex-nowrap">
      <a th:href="@{/home}" class="btn btn-primary mx-2">Regresar</a>
      <a th:href="@{/home}" class="btn btn-primary mx-2">Inicio</a>
      <a th:href="@{/documentacion}" target="_blank" class="btn btn-primary mx-2">Documentación</a>
      <div class="d-flex flex-column justify-content-center align-items-center">
        <i class="fa-solid fa-user"></i>
        <p class="p-0 m-0" style="font-size: normal" th:text="${admin.nombre}"></p>
      </div>
    </nav>
  </header>
  <div id="contenderBase" class="container pt-2 pb-2" style="height: 90vh">
    <h2 class="text-center">Seccion asistencia</h2>
    <div class="d-flex align-items-center justify-content-between pb-1" style="max-width: 95vw">
      <div>
        <form id="alumnoBuscador" class="d-flex col-12">
          <select id="filtroBusquedaAlumno" class="form-select" name="filtroBusquedaAlumno">
            <option value="nombreCurso">Nombre</option>
            <option value="fechaInicio">Fecha del curso</option>
            <option value="ciudad">Ciudad</option>
            <option value="region">Region</option>
            <option value="cliente">Cliente</option>
            <option value="relator">Relator</option>
          </select>
          <input id="busquedaAlumno" type="search" class="col-5" placeholder="Buscar" name="busquedaAlumno"
            onkeydown="submitOnEnter(event)" />
          <button type="button" class="btn btn-outline-primary" onclick="agregarFiltro()">
            Agregar Filtro
          </button>
        </form>
        <div id="filtros-activos" class="d-flex flex-wrap gap-2 mt-2"></div>
      </div>
    </div>
    <div id="contenedorTabla" style="overflow-y: auto; max-height: 70vh; max-width: 95vw">
      <table class="table table-hover table-bordered mb-5" style="table-layout: fixed; height: 100%" id="tablaCurso">
        <thead class="thead-dark">
          <tr>
            <th>Nombre</th>
            <th>fecha del curso</th>
            <th>Ubicacion</th>
            <th>Cliente</th>
            <th>Relator</th>
            <th>Cantidad alumnos temporales</th>
            <th style="width: 25vw">Acción</th>
          </tr>
        </thead>
        <tbody>
          <!-- Se cargarán dinámicamente las filas -->
        </tbody>
      </table>
    </div>
  </div>
  <script th:inline="javascript">
    function cargarDatos() {
      $.ajax({
        url: "/api/datosCurso",
        method: "GET",
        success: function (data) {
          var tbody = $("#tablaCurso tbody");
          tbody.empty(); // Limpiar la tabla antes de agregar nuevos datos

          $.each(data, function (i, curso) {
            if(!curso.asistenciaQr){
              return;
            }
            var adminCorreo = /*[[${admin.correo}]]*/ "default";
            // Construir la fila
            var fila =
              "<tr>" +
              "<td>" +
              (curso.nombreCurso ?? "") +
              "</td>" +
              "<td>" +
              (curso.fechaInicio ? formatearFecha(curso.fechaInicio) : "") +
              "</td>" +
              "<td>" +
              (curso.ciudad && curso.ubicacionSubida
                ? curso.ciudad + ", " + curso.ubicacionSubida
                : "") +
              "</td>" +
              "<td>" +
              (curso.cliente ?? "") +
              "</td>" +
              "<td>" +
              (curso.relator ?? "") +
              "</td>" +
              "<td>" +
              (curso.alumnosTemporales ?? 0) +
              "</td>" +
              "<td style='width: 25vw;display: flex; justify-content: space-around;'>" +
              "<button class='btn btn-sm btn-primary' onclick='generarQrFila(" + curso.id + "," + JSON.stringify(curso.nombreCurso ?? "") + ")'>Generar QR</button>" +
              "<a class='btn btn-sm btn-secondary' href='/seccionAsistencia/revision/" + (curso.id ?? 0) + "'>Revisar</a>" +
              "</td>" +
              "</tr>";

            fila += "</td></tr>";

            tbody.append(fila);
          });
        },
        error: function (error) {
          console.log("Error al obtener los datos", error);
        },
      });
    }
    $(document).ready(function () {
      // Cargar datos inicialmente
      cargarDatos();

      // Actualizar la tabla cada 30 segundos
      setInterval(function () {
        if (filtrosActivos.length > 0) {
          cargarDatosConFiltros();
        } else {
          cargarDatos();
        }
      }, 30000);
    });
  </script>
  <script>
    // Detecta la tecla Enter y simula clic en un botón
    function submitOnEnter(event, buttonId) {
      if (event.key === "Enter") {
        event.preventDefault();
        document.getElementById(buttonId).click();
      }
    }
  </script>
  <script>
    function showAlert(message) {
      if (message && message.trim() !== "") {
        alert(message);
      }
    }
  </script>
  <th:block th:if="${error != null}">
    <script th:inline="javascript">
      showAlert("[[${error}]]");
    </script>
  </th:block>
  <div class="overlay" id="overlayQr">
    <div class="popup">
      <div class="d-flex justify-content-end">

      </div>
      <h4 class="text-center">QR de asistencia</h4>
      <img id="qrImage" class="modal-qr-img" src="" alt="QR" />

        <button id="btnDownloadQr" class="btn btn-primary">Descargar QR</button>

  <footer class="text-center p-3 d-flex justify-content-center align-items-center"

        <a href="tel:+56 41 3830944">+56 41 3830944</a>
      </div>
      <div>
        <i class="fa-solid fa-location-dot"></i>
        <a
          href="https://www.google.com/maps/place/Consultores+Empresariales+E-Volution+Limitada/@-36.8252678,-73.050754,19z/data=!3m1!4b1!4m6!3m5!1s0x9669b5d0308198b5:0xbd67409566499fa!8m2!3d-36.8252678!4d-73.0501103!16s%2Fg%2F11fzwngw1q?entry=ttu&amp;g_ep=EgoyMDI1MDEwNi4xIKXMDSoASAFQAw%3D%3D">
          Freire 728, Oficina 206
        </a>
      </div>
      <div>
        <i class="fa-solid fa-envelope"></i>
        <a href="mailto:contacto@e-volution.cl">contacto@e-volution.cl</a>

  <script th:inline="javascript">
    const checkboxKey = "checkboxStates";
    let filtrosActivos = [];

    function crearCardFiltro(filtro, valor) {
      return `<div class="card filtro-card" style="max-width: 300px;">
                    <div class="card-body p-2 d-flex justify-content-between align-items-center">
                        <span>${filtro}: ${valor}</span>
                        <button type="button" class="btn-close" data-filtro="${filtro}" data-valor="${valor.replace(
        /"/g,
        "&quot;",
      )}"></button>
                    </div>
                </div>`;
    }

    // Agregar este evento delegado para los botones de cerrar
    $(document).on("click", ".btn-close", function () {
      const filtro = $(this).data("filtro");
      const valor = $(this).data("valor");
      removerFiltro(filtro, valor);
    });

    function actualizarFiltrosVisibles() {
      const contenedor = $("#filtros-activos");
      contenedor.empty();
      filtrosActivos.forEach((filtro) => {
        contenedor.append(crearCardFiltro(filtro.campo, filtro.valor));
      });
    }

    function agregarFiltro() {
      const filtro = $("#filtroBusquedaAlumno").val();
      const valor = $("#busquedaAlumno").val().trim();

      if (valor) {
        // Evitar duplicados
        if (
          !filtrosActivos.some((f) => f.campo === filtro && f.valor === valor)
        ) {
          filtrosActivos.push({ campo: filtro, valor: valor });
          actualizarFiltrosVisibles();
          cargarDatosConFiltros();
        }
        $("#busquedaAlumno").val("");
      }
    }

    function removerFiltro(filtro, valor) {
      filtrosActivos = filtrosActivos.filter(
        (f) => !(f.campo === filtro && String(f.valor) === String(valor))
      );


      actualizarFiltrosVisibles();

      if (filtrosActivos.length > 0) {
        cargarDatosConFiltros();
      } else {
        cargarDatos();
      }
    }

    function cargarDatosConFiltros() {
      $.ajax({
        url: "/api/datosCurso/busquedaMultiFiltro",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify(filtrosActivos),
        success: function (data) {
          // Actualizar tabla con los datos recibidos
          actualizarTabla(data);
        },
      });
    }

    function actualizarTabla(data) {
      var tbody = $("#tablaCurso tbody");
      tbody.empty();

      $.each(data, function (i, curso) {
        if(!curso.asistenciaQr){
              return;
        }
        var fila =
          "<tr>" +
          "<td>" +
          (curso.nombreCurso ?? "") +
          "</td>" +
          "<td>" +
          (curso.fechaInicio ? formatearFecha(curso.fechaInicio) : "") +
          "</td>" +
          "<td>" +
          (curso.ciudad && curso.ubicacionSubida
            ? curso.ciudad + ", " + curso.ubicacionSubida
            : "") +
          "</td>" +
          "<td>" +
          (curso.cliente ?? "") +
          "</td>" +
          "<td>" +
          (curso.relator ?? "") +
          "</td>" +
          "<td>" +
          (curso.alumnosTemporales ?? 0) +
          "</td>" +
          "<td style='width: 25vw;display: flex; justify-content: space-around;'>" +
          "<button class='btn btn-sm btn-primary' onclick='generarQrFila(" + curso.id + "," + JSON.stringify(curso.nombreCurso ?? "") + ")'>Generar QR</button>" +
          "<a class='btn btn-sm btn-secondary' href='/seccionAsistencia/revision/" + (curso.id ?? 0) + "'>Revisar</a>" +
          "</td>" +
          "</tr>";

        fila += "</td></tr>";

        tbody.append(fila);
      });
    }
  </script>
  <script>
    function formatearFecha(fechaISO) {
      if (!fechaISO) return "";

      const fecha = new Date(fechaISO);

      const dd = String(fecha.getDate()).padStart(2, "0");
      const mm = String(fecha.getMonth() + 1).padStart(2, "0");
      const aa = String(fecha.getFullYear());
      const hh = String(fecha.getHours()).padStart(2, "0");
      const min = String(fecha.getMinutes()).padStart(2, "0");

      return `${dd}-${mm}-${aa} ${hh}:${min}`;
    }
  </script>
  <script th:inline = "javaScript">
    function generarQrFila(id, cursoNombre) {
      $.ajax({
        url: `/api/cursoTemporal/generarQr/${id}`,
        method: 'GET',
        success: function (res) {
          showQrPopup(res.imageBase64, res.link, cursoNombre);
        },
        error: function (e) { alert('Error generando QR: ' + (e.responseText || e.statusText)); }
      });
    }
    function showQrPopup(base64, link, cursoNombre) {
      console.log("Popup QR recibido", base64?.length, link);
      $('#qrImage').attr('src', 'data:image/png;base64,' + base64);
      $('#qrLink').attr('href', link).text(link);
      $('#btnDownloadQr').off('click').on('click', function () {
        // descargar desde endpoint para asegurar nombre
        const nombre = (cursoNombre || 'curso') + "_QR.png";
        // solicitar descarga
        const a = document.createElement('a');
        a.href = `/api/cursoTemporal/downloadQrByImage?base64=${encodeURIComponent(base64)}&filename=${encodeURIComponent(nombre)}`;
        // como alternativa, hacemos fetch del endpoint de descarga por id; pero aquí usamos una ruta para descargar el base64 como archivo
        // mejor: usar endpoint /api/cursoTemporal/downloadQrByBase64 para POST (implementado en backend)
        // para simplificar, llamaremos al endpoint que sirve archivo por id (si se creó desde el server). Si no, se usará descarga directa:
        const linkBlob = document.createElement('a');
        const imageData = atob(base64);
        const array = new Uint8Array(imageData.length);
        for (let i = 0; i < imageData.length; i++) array[i] = imageData.charCodeAt(i);
        const blob = new Blob([array], { type: 'image/png' });
        const url = URL.createObjectURL(blob);
        linkBlob.href = url;
        linkBlob.download = (cursoNombre || 'curso') + "_QR.png";
        document.body.appendChild(linkBlob);
        linkBlob.click();
        document.body.removeChild(linkBlob);
        URL.revokeObjectURL(url);
      });

      $('#overlayQr').show();
    }

    function closeOverlayQr() { $('#overlayQr').hide(); $('#qrImage').attr('src', ''); $('#qrLink').attr('href', '').text(''); }

    // helper: descarga por id (si quieres usar)
    function descargarQrPorId(id, nombreCurso) {
      window.location = `/api/cursoTemporal/downloadQr/${id}?filename=${encodeURIComponent((nombreCurso || 'curso') + '_QR.png')}`;
    }

  </script>
</body>
