<!doctype html>

<head>
  <title>Base de datos cursos</title>

  <!-- Importar CSS de Bootstrap -->

  <link rel="stylesheet" th:href="@{/css/styleCustom.css}" />
  <link rel="icon" th:href="@{/images/Logobgremove.png}" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <!-- Importar jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <!-- Importar JS de Bootstrap -->

  <style>
    th {
      font-size: 13px;
    }

    td {
      overflow-x: auto;
      font-size: 11px;
    }

    #alumnoBuscador {
      padding-right: 0px;
      padding-left: 0px;
    }

    .overlay {
      display: none;
      /* Oculto por defecto */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      /* Fondo oscuro */
      z-index: 999;
      /* Por encima de otros elementos */
    }

    /* Contenedor del formulario emergente */
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      /* Por encima del overlay */
    }

    /* Botón cerrar */
    .close-btn {
      background-color: red;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .close-btn:hover {
      background-color: darkred;
    }

    /* Botón principal */
    .open-btn {
      margin: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #alumnosNoEnviados {
      height: 50vh;
      /* Define una altura fija */
      overflow-y: auto;
      /* Permite el desplazamiento vertical cuando el contenido es grande */
    }

    @media (min-width: 1024px) {
      #contenderBase {
        max-width: 95vw;
      }
    }

    @media (max-width: 768px) {
      #contenderBase {
        max-width: 100vw !important;
        padding-left: 0px !important;
        padding-right: 0px !important;
      }

      #contenedorTabla {
        max-width: 100vw !important;
        overflow-y: auto;
        overflow-x: auto;
      }

      #alumnoBuscador {
        max-width: 100vw !important;
      }

      th {
        font-size: 15px;
      }

      td {
        overflow-x: auto;
        font-size: 12px;
      }

      #tablaPlantilla {
        width: 250vw;
      }
    }
  </style>
</head>

<body>
  <header class="d-flex align-items-center justify-content-between p-3 bg-light" style="height: 10vh; z-index: 1">
    <a th:href="@{/home}" class="logo">
      <img th:src="@{/images/Logobgremove.png}" alt="[LOGO]" />
    </a>
    <nav class="d-flex justify-content-center align-items-center flex-nowrap">

  <div id="contenderBase" class="container pt-2 pb-2" style="height: 90vh">

    <div class="d-flex align-items-center justify-content-between pb-1" style="max-width: 95vw">
      <div>
        <form id="alumnoBuscador" class="d-flex col-12">
          <select id="filtroBusquedaAlumno" class="form-select" name="filtroBusquedaAlumno">
            <option value="nombreCurso">Nombre</option>
            <option value="fechaInicio">Fecha del curso</option>
            <option value="ciudad">Ciudad</option>
            <option value="region">Region</option>
            <option value="cliente">Cliente</option>
          </select>
          <input id="busquedaAlumno" type="search" class="col-5" placeholder="Buscar" name="busquedaAlumno"
            onkeydown="submitOnEnter(event)" />
          <button type="button" class="btn btn-outline-primary" onclick="agregarFiltro()">
            Agregar Filtro
          </button>
        </form>
        <div id="filtros-activos" class="d-flex flex-wrap gap-2 mt-2"></div>
      </div>
      <div></div>
    </div>
    <div id="contenedorTabla" style="overflow-y: auto; max-height: 70vh; max-width: 95vw">
      <table class="table table-hover table-bordered mb-5" style="table-layout: fixed; height: 100%" id="tablaCurso">
        <thead class="thead-dark">
          <tr>
            <th>Nombre</th>
            <th>fecha del curso</th>
            <th>Ubicacion</th>
            <th>Cliente</th>
            <th>Relator</th>
            <th>Cantidad Alumnos</th>
            <th style="width: 25vw">Acción</th>
          </tr>
        </thead>
        <tbody>
          <!-- Se cargarán dinámicamente las filas -->
        </tbody>
      </table>
    </div>
  </div>
  <script th:inline="javascript">
    const relator = /*[[${relator}]]*/ "";
    function cargarDatos() {
      $.ajax({
        url: "/api/datosCurso/relator/" + relator,
        method: "GET",
        success: function (data) {
          var tbody = $("#tablaCurso tbody");
          tbody.empty(); // Limpiar la tabla antes de agregar nuevos datos

          $.each(data, function (i, curso) {
            // Inyectar el correo del admin en sesión desde el modelo
            var adminCorreo = /*[[${admin.correo}]]*/ "default";
            // Construir la fila
            let estiloFila = "";
            let aviso = "";

            if (curso.fechaInicio) {
              const ahora = new Date();
              const fechaCurso = new Date(curso.fechaInicio);

              const diffMs = fechaCurso - ahora;
              const diffDias = diffMs / (1000 * 60 * 60 * 24);

              if (diffDias <= 1 && diffDias >= 0) {
                // curso mañana o hoy
                estiloFila = " style='background-color: #fff3cd;'"; // amarillo suave
                aviso = " (Próximo)";
              } else if (diffDias > 1) {
                // falta más tiempo
                estiloFila = " style='background-color: #e7f5ff;'"; // azul suave
              } else {
                // ya pasó (opcional)
                estiloFila = " style='background-color: #f8d7da;'"; // rojo suave muy leve
                aviso = " (Ya iniciado)";
              }
            }
            var fila =
              "<tr>" +
              "<td>" +
              (curso.nombreCurso ?? "") +
              "</td>" +
              "<td " +
              estiloFila +
              ">" +
              (curso.fechaInicio
                ? formatearFecha(curso.fechaInicio) + aviso
                : "") +
              "</td>" +
              "<td>" +
              (curso.ciudad && curso.ubicacionSubida
                ? curso.ciudad + ", " + curso.ubicacionSubida
                : "") +
              "</td>" +
              "<td>" +
              (curso.cliente ?? "") +
              "</td>" +
              "<td>" +
              (curso.relator ?? "") +
              "</td>" +
              "<td>" +
              (curso.alumnos ?? 0) +
              "</td>" +
              "<td style='width: 25vw;display: flex; justify-content: space-around;'>" +
              "<a class='btn btn-primary' href='/dataBaseCurso/Curso/" +
              curso.id +
              "/editar'>Editar</a>" +
              "<a class='btn btn-secondary' href='/dataBaseCurso/Curso/" +
              curso.id +
              "/alumnos'>Alumnos</a>"+
              "<button class='btn btn-success' onclick='descargarFlyer("+curso.id+")'>Flyer</button>";
            if (adminCorreo === "admin@admin.com") {
              fila +=
                "<button class='btn btn-danger btn-sm' onclick='eliminarCurso(" +
                curso.id +
                ")'>Borrar</button>" +
                "</td>" +
                "</tr>";
            }

            tbody.append(fila);
          });
        },
        error: function (error) {
          console.log("Error al obtener los datos", error);
        },
      });
    }
    $(document).ready(function () {
      // Cargar datos inicialmente
      cargarDatos();

      // Actualizar la tabla cada 30 segundos
      setInterval(function () {
        if (filtrosActivos.length > 0) {
          cargarDatosConFiltros();
        } else {
          cargarDatos();
        }
      }, 30000);
    });
  </script>
  <script>
    // Detecta la tecla Enter y simula clic en un botón
    function submitOnEnter(event, buttonId) {
      if (event.key === "Enter") {
        event.preventDefault();
        document.getElementById(buttonId).click();
      }
    }
  </script>
  <script>
    function showAlert(message) {
      if (message && message.trim() !== "") {
        alert(message);
      }
    }
  </script>
  <th:block th:if="${error != null}">
    <script th:inline="javascript">
      showAlert("[[${error}]]");
    </script>
  </th:block>
  <footer class="text-center p-3 d-flex justify-content-center align-items-center"
    style="height: 15vh; background-color: #f8f9fa">

      <div>
        <i class="fa-solid fa-phone"></i>
        <a href="tel:+56 41 3830944">+56 41 3830944</a>
      </div>
      <div>
        <i class="fa-solid fa-location-dot"></i>

          href="https://www.google.com/maps/place/Consultores+Empresariales+E-Volution+Limitada/@-36.8252678,-73.050754,19z/data=!3m1!4b1!4m6!3m5!1s0x9669b5d0308198b5:0xbd67409566499fa!8m2!3d-36.8252678!4d-73.0501103!16s%2Fg%2F11fzwngw1q?entry=ttu&amp;g_ep=EgoyMDI1MDEwNi4xIKXMDSoASAFQAw%3D%3D">
          Freire 728, Oficina 206
        </a>
      </div>
      <div>
        <i class="fa-solid fa-envelope"></i>
        <a href="mailto:contacto@e-volution.cl">contacto@e-volution.cl</a>

    </div>
  </footer>
  <script th:inline="javascript">
    const checkboxKey = "checkboxStates";
    let filtrosActivos = [];

    function crearCardFiltro(filtro, valor) {
      return `<div class="card filtro-card" style="max-width: 300px;">
                    <div class="card-body p-2 d-flex justify-content-between align-items-center">
                        <span>${filtro}: ${valor}</span>
                        <button type="button" class="btn-close" data-filtro="${filtro}" data-valor="${valor.replace(
        /"/g,
        "&quot;",
      )}"></button>
                    </div>
                </div>`;
    }

    // Agregar este evento delegado para los botones de cerrar
    $(document).on("click", ".btn-close", function () {
      const filtro = $(this).data("filtro");
      const valor = $(this).data("valor");
      removerFiltro(filtro, valor);
    });

    function actualizarFiltrosVisibles() {
      const contenedor = $("#filtros-activos");
      contenedor.empty();
      filtrosActivos.forEach((filtro) => {
        contenedor.append(crearCardFiltro(filtro.campo, filtro.valor));
      });
    }

    function agregarFiltro() {
      const filtro = $("#filtroBusquedaAlumno").val();
      const valor = $("#busquedaAlumno").val().trim();

      if (valor) {
        // Evitar duplicados
        if (
          !filtrosActivos.some((f) => f.campo === filtro && f.valor === valor)
        ) {
          filtrosActivos.push({ campo: filtro, valor: valor });
          actualizarFiltrosVisibles();
          cargarDatosConFiltros();
        }
        $("#busquedaAlumno").val("");
      }
    }

    function removerFiltro(filtro, valor) {
      filtrosActivos = filtrosActivos.filter(
        (f) => !(f.campo === filtro && String(f.valor) === String(valor)),
      );

      actualizarFiltrosVisibles();

      if (filtrosActivos.length > 0) {
        cargarDatosConFiltros();
      } else {
        cargarDatos();
      }
    }

    function cargarDatosConFiltros() {
      $.ajax({
        url: "/api/datosCurso/busquedaMultiFiltro/relator/" + relator,
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify(filtrosActivos),
        success: function (data) {
          // Actualizar tabla con los datos recibidos
          actualizarTabla(data);
        },
      });
    }

    function actualizarTabla(data) {
      var tbody = $("#tablaCurso tbody");
      tbody.empty();

      $.each(data, function (i, curso) {
        // Construir la fila
        let estiloFila = "";
        let aviso = "";

        if (curso.fechaInicio) {
          const ahora = new Date();
          const fechaCurso = new Date(curso.fechaInicio);

          const diffMs = fechaCurso - ahora;
          const diffDias = diffMs / (1000 * 60 * 60 * 24);

          if (diffDias <= 1 && diffDias >= 0) {
            // curso mañana o hoy
            estiloFila = " style='background-color: #fff3cd;'"; // amarillo suave
            aviso = " (Próximo)";
          } else if (diffDias > 1) {
            // falta más tiempo
            estiloFila = " style='background-color: #e7f5ff;'"; // azul suave
          } else {
            // ya pasó (opcional)
            estiloFila = " style='background-color: #f8d7da;'"; // rojo suave muy leve
            aviso = " (Ya iniciado)";
          }
        }
        var fila =
          "<tr>" +
          "<td>" +
          (curso.nombreCurso ?? "") +
          "</td>" +
          "<td " +
          estiloFila +
          ">" +
          (curso.fechaInicio
            ? formatearFecha(curso.fechaInicio) + aviso
            : "") +
          "</td>" +
          "<td>" +
          (curso.ciudad && curso.ubicacionSubida
            ? curso.ciudad + ", " + curso.ubicacionSubida
            : "") +
          "</td>" +
          "<td>" +
          (curso.cliente ?? "") +
          "</td>" +
          "<td>" +
          (curso.relator ?? "") +
          "</td>" +
          "<td>" +
          (curso.alumnos ?? 0) +
          "</td>" +
          "<td style='width: 25vw;display: flex; justify-content: space-around;'>" +
          "<a class='btn btn-primary' href='/dataBaseCurso/Curso/" +
          curso.id +
          "/editar'>Editar</a>" +
          "<a class='btn btn-secondary' href='/dataBaseCurso/Curso/" +
          curso.id +
          "/alumnos'>Alumnos</a>"+
          "<button class='btn btn-success' onclick='descargarFlyer("+curso.id+")'>Flyer</button>";
        if (adminCorreo === "admin@admin.com") {
          fila +=
            "<button class='btn btn-danger btn-sm' onclick='eliminarCurso(" +
            curso.id +
            ")'>Borrar</button>" +
            "</td>" +
            "</tr>";
        }

        tbody.append(fila);
      });
    }
  </script>

  <script>
    function formatearFecha(fechaISO) {
      if (!fechaISO) return "";

      const fecha = new Date(fechaISO);

      const dd = String(fecha.getDate()).padStart(2, "0");
      const mm = String(fecha.getMonth() + 1).padStart(2, "0");
      const aa = String(fecha.getFullYear());
      const hh = String(fecha.getHours()).padStart(2, "0");
      const min = String(fecha.getMinutes()).padStart(2, "0");

      return `${dd}-${mm}-${aa} ${hh}:${min}`;
    }
  </script>
  <script th:inline="javascript">
    function eliminarCurso(id) {
      if (!confirm("¿Seguro que quieres eliminar este curso?")) {
        return;
      }

      fetch("/api/dataBaseCurso/borrarCurso/" + id, {
        method: "DELETE"
      })
        .then(response => {
          if (response.ok) {
            location.reload();
          } else {
            alert("Error al eliminar curso");
          }
        })
        .catch(error => {
          console.error(error);
          alert("Error de conexión");
        });
    }

  </script>
  <script th:inline="javascript">
      async function descargarFlyer(id) {
        try {
          const response = await fetch("/api/dataBaseCurso/descargarFlyer", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ id: id }),
          });

          if (!response.ok) {
            throw new Error("Error al descargar el flyer");
          }

          const blob = await response.blob();

          const url = window.URL.createObjectURL(blob);

          const a = document.createElement("a");
          a.href = url;
          a.download = "Flyer.pptx";
          document.body.appendChild(a);
          a.click();

          a.remove();
          window.URL.revokeObjectURL(url);
        } catch (error) {
          console.error("Error:", error);
          alert("Error al generar el flyer");
        }
      }
    </script>
</body>
