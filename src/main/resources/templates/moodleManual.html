<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programación de Certificados</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styleCustom.css}">
    <link rel="icon" th:href="@{/images/Logobgremove.png}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Importar jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>  
    <!-- Importar JS de Bootstrap -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <style>
        .scrollable-table {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .form-card {
            max-width: 800px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <header class="d-flex align-items-center justify-content-between p-3 bg-light" style="height: 10vh;">
        <a href="/home" class="logo"><img src="/images/Logobgremove.png" alt="[LOGO]"></a>
        <nav class="d-flex justify-content-center align-items-center flex-nowrap">
            <a href="/home" class="btn btn-primary mx-2">Inicio</a>
            <a href="/documentacion" target="_blank" class="btn btn-primary mx-2">Documentación</a>
            <div class="d-flex flex-column justify-content-center align-items-center">
                <i class="fa-solid fa-user"></i>
                <p class="p-0 m-0" style="font-size: normal;" th:text="${admin.nombre}"></p>
            </div>
        </nav>
    </header>

    <main class="container">
        <!-- Formulario en Card -->
        <div class="card shadow" style="width: 900px !important; margin: 20px auto;">
              <div class="card-body">
                <h4 class="text-center mb-4">Emitir certificados para Moodle</h4>
                <form id="formCertificado" th:action="@{/programarCertificadoMoodleManual/crear}" method="post">
                  <div>
                    <label for="cursoMoodle" class="form-label">Curso de Moodle</label>
                      <select name="cursoMoodle" id="cursoMoodle" class="form-select">
                        <option value="">Seleccionar Curso</option>
                        <option th:each="curso : ${cursosMoodle}" 
                                th:value="${curso.id}" 
                                th:text="${curso.nombre}"></option>
                      </select>
                  </div>
                  <div>
                      <label for="cursoInput">Curso</label>
                                <input id="cursoInput" type="text" placeholder="Escribe para buscar un curso"
                                    autocomplete="off" class="form-control" />
                                <input type="hidden" name="cursoId" id="cursoId" required />
                                <div id="cursoResultados" class="list-group position-absolute w-100"
                                    style="z-index: 1000; display: none">
                                </div>
                  </div>
                  <div class="d-grid">
                    <button id="busqueda" class="btn btn-primary btn-lg">Siguiente</button>
                  </div>
                
              
                  <table class="table table-striped" id="tablaAlumnos">
                    <thead>
                      <tr>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Nota</th>
                        <th>Asistencia</th>
                        <th>Habilitado</th>
                      </tr>
                    </thead>
                    <tbody></tbody>
                  </table>
              
                  <div class="d-flex gap-2">
                    <button id="guardarAlumnos" name="accion" value="guardarAlumnos" class="btn btn-success" type="submit">Guardar</button>
                  </div>
                </div>
                </form>

                
              </div>
            </div>
        </div>    
    </main>
    <script>
      $(document).ready(function() {
          $('#busqueda').click(function(e) {
              e.preventDefault();
              const cursoId = $('#cursoMoodle').val();

              if(!cursoId) {
                  alert('Seleccione un curso');
                  return;
              }

              $.ajax({
                  url: '/api/programarCertificadoMoodleManual/alumnos/' + cursoId,
                  type: 'GET',
                  success: function(alumnos) {
                      renderizarAlumnos(alumnos);
                      $('#alumnosSection').show();
                  },
                  error: function() {
                      alert('Error al obtener alumnos');
                  }
              });
          });
        
          function renderizarAlumnos(alumnos) {
              const tbody = $('#tablaAlumnos tbody');
              tbody.empty();

              alumnos.forEach((alumno, index) => {
                  const tr = `
                  <tr>
                      <td>
                          <input type="text" class="form-control" name="alumnos[${index}].nombreAsistente" 
                                 value="${alumno.nombreAsistente}" required>
                      </td>
                      <td>
                          <input type="email" class="form-control" name="alumnos[${index}].correo" 
                                 value="${alumno.correo}" required>
                      </td>
                      <td>
                          <input type="number" step="0.1" class="form-control" name="alumnos[${index}].notaAprobacion" 
                                 value="${alumno.notaAprobacion}" min="1" max="7" required>
                      </td>
                      <td>
                          <input type="text" class="form-control" name="alumnos[${index}].asistencia" 
                                 value="100" readonly>
                      </td>
                      <td>
                          <select class="form-select" name="alumnos[${index}].estado">
                              <option value="Aprobado" selected>Sí</option>
                              <option value="noAprobado">No</option>
                          </select>
                      </td>
                  </tr>`;
                  tbody.append(tr);
              });
          }
        
         
      });
      </script>
    <footer class="text-center p-3 bg-light d-flex justify-content-center align-items-center" style="height: 15vh;">
        <div>
            <div><i class="fa-solid fa-phone"></i><a href="tel:+56 41 3830944">+56 41 3830944</a></div>
            <div><i class="fa-solid fa-location-dot"></i><a href="https://www.google.com/maps/place/Consultores+Empresariales+E-Volution+Limitada/@-36.8252678,-73.050754,19z/data=!3m1!4b1!4m6!3m5!1s0x9669b5d0308198b5:0xbd67409566499fa!8m2!3d-36.8252678!4d-73.0501103!16s%2Fg%2F11fzwngw1q?entry=ttu&g_ep=EgoyMDI1MDEwNi4xIKXMDSoASAFQAw%3D%3D">Freire 728, Oficina 206</a></div>
            <div><i class="fa-solid fa-envelope"></i><a href="mailto:contacto@e-volution.cl">contacto@e-volution.cl</a></div>
        </div>
    </footer>
    <script th:inline="javascript">
        $(document).ready(function () {
            let cursoSeleccionado = false;

            $("#cursoInput").on("input", function () {
                const texto = $(this).val();
                cursoSeleccionado = false;
                $("#cursoId").val("");

                if (texto.length < 2) {
                    $("#cursoResultados").hide();
                    return;
                }

                $.get("/api/curso/buscar", { q: texto }, function (data) {
                    const contenedor = $("#cursoResultados");
                    contenedor.empty();

                    if (data.length === 0) {
                        contenedor.hide();
                        return;
                    }

                    data.forEach((curso) => {
                        contenedor.append(`
                            <button 
                                type="button"
                                class="list-group-item list-group-item-action"
                                data-id="${curso.id}"
                                data-nombre="${curso.nombreCurso}">
                                ${curso.nombreCurso}
                            </button>
                        `);
                    });

                    contenedor.show();
                });
            });

            // CLICK EN OPCIÓN
            $(document).on("click", "#cursoResultados button", function () {
                $("#cursoInput").val($(this).data("nombre"));
                $("#cursoId").val($(this).data("id"));
                cursoSeleccionado = true;
                $("#cursoResultados").hide();
            });

            // BLOQUEO SI NO SE SELECCIONÓ
            $("form").on("submit", function (e) {
                if (!cursoSeleccionado) {
                    e.preventDefault();
                    alert("Debes seleccionar un curso válido de la lista");
                    $("#cursoInput").focus();
                }
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
