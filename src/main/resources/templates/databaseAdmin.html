<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Lista de Administradores</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Importar CSS de Bootstrap -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styleCustom.css}">
    <link rel="icon" th:href="@{/images/Logobgremove.png}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Importar jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>  
    <!-- Importar JS de Bootstrap -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <style>
        th{
            font-size: 16px;
        }

        td{
            overflow-x: auto;
            font-size: 14px;
        }

        #alumnoBuscador{
                padding-right: 0px;
                padding-left: 0px;
        }

        .overlay {
            display: none; /* Oculto por defecto */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7); /* Fondo oscuro */
            z-index: 999; /* Por encima de otros elementos */
        }

        /* Contenedor del formulario emergente */
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000; /* Por encima del overlay */
        }

        /* Botón cerrar */
        .close-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .close-btn:hover {
            background-color: darkred;
        }

        /* Botón principal */
        .open-btn {
            margin: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #alumnosNoEnviados {
            height: 50vh; /* Define una altura fija */
            overflow-y: auto; /* Permite el desplazamiento vertical cuando el contenido es grande */
        }

        @media (min-width: 1024px){
            #contenderBase{
                max-width: 95vw;
            }
        }
        @media (max-width: 768px) {
            #contenderBase{
                max-width: 100vw !important;
                padding-left: 0px !important;
                padding-right: 0px !important;
            }
            #contenedorTabla {
                max-width: 100vw !important;
                overflow-y: auto;
                overflow-x: auto;
            }

            #alumnoBuscador{
                max-width: 100vw !important;
            }

            th{
                font-size: 15px;
            }

            td{
                overflow-x: auto;
                font-size: 12px;
            }

            #tablaAlumnos{
                width: 250vw;
            }
        }

    </style>
</head>
<body>
    <header class="d-flex align-items-center justify-content-between p-3 bg-light" style="height: 10vh; z-index: 1;" >
        <a th:href="@{/home}" class="logo"><img th:src="@{/images/Logobgremove.png}" alt="[LOGO]"></a>
        <nav class="d-flex justify-content-center align-items-center flex-nowrap">
            <a th:href="@{/home}" class="btn btn-primary mx-2">Regresar</a>
            <a th:href="@{/home}" class="btn btn-primary mx-2">Inicio</a>
            <a th:href="@{/documentacion}" target="_blank" class="btn btn-primary mx-2">Documentación</a>
            <div class="d-flex flex-column justify-content-center align-items-center">
                <i class="fa-solid fa-user"></i>
                <p class="p-0 m-0" style="font-size: normal;" th:text="${admin.nombre}"></p>
            </div>
        </nav>
    </header>
    <div id="contenderBase" class="container pt-2 pb-2" style="height: 90vh;">
        <h2 class="text-center">Base de datos Administradores</h2>
        <div class="d-flex align-items-center justify-content-end pb-1" style="max-width: 95vw;">
            <div th:if="${admin.correo == 'admin@admin.com'}">
                <button class="btn btn-success" onclick="openForm()">Agregar nuevo administradores</button>
            </div>
        </div>
        <div id="contenedorTabla" style="overflow-y: auto; max-height: 70vh; max-width: 95vw;">
            <table class="table table-hover table-bordered mb-5" style="table-layout: auto; height: 100%;" id="tablaAdmin">
                <thead class="thead-dark">
                    <tr>
                        <th>Correo</th>
                        <th>Nombre</th>
                        <th style="width: 10vw;">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Las filas se agregarán dinámicamente aquí -->
                </tbody>
            </table>
        </div>
    </div>
    <script>
        $(document).ready(function () {
            function cargarDatos() {
                $.ajax({
                    url: "/api/datosAdmin",
                    method: "GET",
                    success: function (data) {
                        var tbody = $("#tablaAdmin tbody");
                        var correoUsuarioEnSesion = "[[${admin.correo}]]";
                        tbody.empty(); // Limpiar la tabla antes de agregar nuevos datos
    
                        $.each(data, function (i, admins) {
                            // Crear una fila de tabla
                            var fila = "<tr>" +
                                "<td>" + (admins.correo != null ? admins.correo : "") + "</td>" +
                                "<td>" + (admins.nombre != null ? admins.nombre : "") + "</td>";
    
                            // Agregar el botón borrar solo si admin.nombre no es "admin"
                            if (correoUsuarioEnSesion === "admin@admin.com" && admins.correo !== "admin@admin.com") {
                                fila += "<td style='width: 10vw;'>" + "<a class='btn btn-danger' th:href='@{/dataBaseAdmin/{id}/borrar(id=${admins.id})}'>Borrar</a>" + "</td>";
                            } else {
                                fila += "<td></td>"; // Dejar la celda vacía si es "admin"
                            }
    
                            fila += "</tr>";
                            tbody.append(fila);
                        });
                    },
                    error: function (error) {
                        console.log("Error al obtener los datos", error);
                    }
                });
            }
    
            // Cargar datos inicialmente
            cargarDatos();
    
            // Actualizar la tabla cada 30 segundos (30000 milisegundos)
            setInterval(cargarDatos, 30000);
        });
    </script>
    <script>
        // Función que detecta la tecla Enter
        function submitOnEnter(event, buttonId) {
            // Verifica si la tecla presionada es Enter (código 13)
            if (event.key === 'Enter') {
                event.preventDefault(); // Evita el comportamiento predeterminado
                document.getElementById(buttonId).click(); // Simula un clic en el botón
            }
        }
    </script>
    <div class="overlay" id="overlay">
        <div class="popup col-4">
            <div class="d-flex justify-content-end">
                <button class="btn btn-danger" onclick="closeForm()">Cerrar</button>
            </div>
            <h2 class="text-center pb-2">Crear Admin</h2>
            <form th:action="@{/dataBaseAdmin/nuevoAdmin}" method="post">
                <div class="d-flex justify-content-center">
                    <div style="max-width: 100%;">
                        <div class="pb-2">
                        <label for="correo">Correo</label>
                        <input type="email" name="correo" id="correo" class="form-control">
                        </div>
                        <div class="pb-2">
                        <label for="nombre">Nombre</label>
                        <input type="text" name="nombre" id="nombre" class="form-control">
                        </div>
                        <label for="contrasena">Contraseña</label>
                        <input type="password" name="contrasena" id="contrasena" class="form-control">
                    </div>
                </div>
    
                <div class="pt-2 d-flex justify-content-center">
                    <input class="btn btn-success" type="submit" value="Enviar">
                </div>
            </form>
        </div>
    </div>
    <script>
        // Función para mostrar el formulario
        function openForm() {
            document.getElementById('overlay').style.display = 'block';
        }

        // Función para ocultar el formulario
        function closeForm() {
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
    <script>
        function toggleInputs(type) {
            if (type === 'logo') {
                const checkbox = document.getElementById('clonarLogo');
                const inputFile = document.getElementById('inputLogo');
                const selectOptions = document.getElementById('selectLogo');
            
                if (checkbox.checked) {
                    inputFile.style.display = 'none';
                    selectOptions.style.display = 'block';
                } else {
                    inputFile.style.display = 'block';
                    selectOptions.style.display = 'none';
                }
            } else if (type === 'plantilla') {
                const checkbox = document.getElementById('clonarPlantilla');
                const inputFile = document.getElementById('inputPlantilla');
                const selectOptions = document.getElementById('selectPlantilla');
            
                if (checkbox.checked) {
                    inputFile.style.display = 'none';
                    selectOptions.style.display = 'block';
                } else {
                    inputFile.style.display = 'block';
                    selectOptions.style.display = 'none';
                }
            }
        }
    </script>
    <script>
        function showAlert(message) {
            if (message && message.trim() !== "") { 
                alert(message);
            }
        }
    </script>
    <th:block th:if="${not empty error}">
        <script>
            showAlert("[[${error}]]");
        </script>
    </th:block>
    <footer class="text-center p-3d-flex justify-content-center align-items-center" style="height: 15vh; background-color: #f8f9fa;">
        <div>
            <div><i class="fa-solid fa-phone"></i><a href="tel:+56 41 3830944">+56 41 3830944</a></div>
            <div><i class="fa-solid fa-location-dot"></i><a href="https://www.google.com/maps/place/Consultores+Empresariales+E-Volution+Limitada/@-36.8252678,-73.050754,19z/data=!3m1!4b1!4m6!3m5!1s0x9669b5d0308198b5:0xbd67409566499fa!8m2!3d-36.8252678!4d-73.0501103!16s%2Fg%2F11fzwngw1q?entry=ttu&g_ep=EgoyMDI1MDEwNi4xIKXMDSoASAFQAw%3D%3D">Freire 728, Oficina 206</a></div>
            <div><i class="fa-solid fa-envelope"></i><a href="mailto:contacto@e-volution.cl">contacto@e-volution.cl</a></div>
        </div>
    </footer>
</body>
</html>
