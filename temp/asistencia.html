<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia para certificado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styleAsistencia.css">
    <script src="scriptAsistencia.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="contenedor">
        <main>
            <div id="carta" class="card">
                <div id="logo"><img src="/src/main/resources/static/images/Logobgremove.png" alt="Logo E-volution"></div>
                <div class="card-body">
                    <form action="" method="post">
                        <label for="nombreAsistente">Nombre completo</label>
                        <input class="form-control" type="text" name="nombreAsistente" placeholder="Nombre Apellidos">
                        <br>
                        <label for="correoAsistente">Correo</label>
                        <input type="email" class="form-control" id="correoAsistente" placeholder="correo@dominio.com">
                        <br>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="checkboxConfirmacion" id="checkboxConfirmacion">
                            <label style="font-style: italic;" class="form-check-label" for="checkboxConfirmacion">
                                Declaro que los datos proporcionados serán utilizados exclusivamente para la generación del certificado correspondiente, sin ningún otro propósito adicional. Asimismo, confirmo que la información enviada es veraz, correcta y actualizada.
                            </label>
                        </div>
                        <br>
                        <div style="display: flex;justify-content: center;align-items: center;"><input type="submit" class="btn btn-success" value="Enviar datos"></div>
                    </form>
                </div>
            </div>
        </main>
        <footer>
            
        </footer>
    </div>
</body>
</html>
