version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: evolution_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appevolution
      MYSQL_USER: app
      MYSQL_PASSWORD: Lmh8ybA5yibFiW1K
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # Restauración inicial: MariaDB ejecuta automáticamente cualquier .sql
      # que encuentre acá SOLO la primera vez que el volumen está vacío
      - C:/evolutionApp/db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: evolution_app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=app
      - DB_PASSWORD=Lmh8ybA5yibFiW1K
      - DB_NAME=appevolution
      - SP_MAIL_HOST=mail.e-volution.cl
      - SP_MAIL_PORT=465
      - SP_MAIL_USERNAME=diplomas@e-volution.cl
      - SP_MAIL_PASSWORD=bUS39WvrTye
      - AD_MAIL=admin@admin.com
      - AD_NAME=admin
      - AD_PASSWORD=RcOqkObsJN
      - ST_FOLDER=/app/static
      - ENCRYPT_KEY_ASIS=t8iLdaYUBMsMDMt5
      - URL_PATH=https://app.e-volution.cl
      - MOODLE_TOKEN=255a3f0b97656fcec9552a98df8c13c3
      - MOODLE_PATH=https://aulavirtual.e-volution.cl
      - ENCRYPT_KEY_GEN=eFSan7jbftsl2P6
      - DIP_MAIL=diplomas@e-volution.cl
    volumes:
      # Bind mount directo a la carpeta que ya tenían en Windows
      - C:/evolutionApp/e-volution/app/evolution/static:/app/static
      - C:/evolutionApp/e-volution/app/evolution/static:/home/e-volution/app/evolution/static

  backup:
    image: mariadb:10.11
    container_name: evolution_backup
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MYSQL_PWD=root
    volumes:
      - C:/evolutionApp/backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          FECHA=$$(date +%Y%m%d_%H%M%S)
          echo "[backup] Generando dump $$FECHA..."
          mysqldump -h db -u root appevolution > /backups/appevolution_$$FECHA.sql

          # Rotación: dejar solo los 2 backups más recientes
          cd /backups
          ls -1t appevolution_*.sql | tail -n +3 | xargs -r rm --

          echo "[backup] Listo. Backups actuales:"
          ls -lh /backups
          sleep 86400
        done

volumes:
  mariadb_data: